<svg width="1280" height="360" viewBox="0 0 1280 360" xmlns="http://www.w3.org/2000/svg" role="img">
<title>AlexBaranovIT GitHub profile banner</title>
<desc>Dark banner reading Alex Baranov, building AI agents and automation tools, with a terminal panel.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0a0e14"/>
<stop offset="1" stop-color="#0d1117"/>
</linearGradient>
<radialGradient id="glow" cx="0.22" cy="0.32" r="0.55">
<stop offset="0" stop-color="#1f6feb" stop-opacity="0.34"/>
<stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
</radialGradient>
<linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#58a6ff"/>
<stop offset="1" stop-color="#1f6feb"/>
</linearGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
<circle cx="2" cy="2" r="1" fill="#2a3340" fill-opacity="0.5"/>
</pattern>
<style>
.cur{animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.gl{animation:pl 5s ease-in-out infinite}
@keyframes pl{50%{opacity:0.65}}
</style>
</defs>
<rect width="1280" height="360" rx="14" fill="url(#bg)"/>
<rect width="1280" height="360" rx="14" fill="url(#dots)"/>
<rect class="gl" width="1280" height="360" rx="14" fill="url(#glow)"/>
<rect x="0.5" y="0.5" width="1279" height="359" rx="14" fill="none" stroke="#21262d" stroke-width="1"/>

<text x="80" y="112" font-family="ui-monospace,'SF Mono','JetBrains Mono',monospace" font-size="19" fill="#58a6ff">@AlexBaranovIT</text>

<text x="78" y="184" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Inter,sans-serif" font-size="66" font-weight="700" fill="#e6edf3" letter-spacing="-1">Alex Baranov</text>
<rect x="82" y="200" width="118" height="4" rx="2" fill="url(#blue)"/>

<text x="82" y="248" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Inter,sans-serif" font-size="27" font-weight="500" fill="#c9d1d9">Building AI agents &amp; automation tools</text>
<text x="82" y="284" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Inter,sans-serif" font-size="18" fill="#768390">Python  •  LLMs  •  Telegram Bots  •  AI Workflows</text>

<circle cx="90" cy="316" r="5" fill="#3fb950"/>
<text x="104" y="322" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Inter,sans-serif" font-size="16" font-weight="500" fill="#3fb950">Always shipping</text>

<rect x="858" y="76" width="344" height="208" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<rect x="858" y="76" width="344" height="40" rx="14" fill="#161b22"/>
<rect x="858" y="100" width="344" height="16" fill="#161b22"/>
<circle cx="886" cy="96" r="6" fill="#ff5f56"/>
<circle cx="908" cy="96" r="6" fill="#febc2e"/>
<circle cx="930" cy="96" r="6" fill="#28c840"/>
<text x="956" y="101" font-family="ui-monospace,'SF Mono',monospace" font-size="13" fill="#768390">alex@it: ~/ship</text>

<text x="884" y="160" font-family="ui-monospace,'SF Mono','JetBrains Mono',monospace" font-size="15" fill="#768390">$ <tspan fill="#c9d1d9">python deploy.py</tspan></text>
<text x="884" y="192" font-family="ui-monospace,'SF Mono','JetBrains Mono',monospace" font-size="15" fill="#3fb950">✓ <tspan fill="#768390">telegram bot · live 24/7</tspan></text>
<text x="884" y="224" font-family="ui-monospace,'SF Mono','JetBrains Mono',monospace" font-size="15" fill="#3fb950">✓ <tspan fill="#768390">workflow shipped</tspan></text>
<text x="884" y="256" font-family="ui-monospace,'SF Mono','JetBrains Mono',monospace" font-size="15" fill="#768390">$ <tspan class="cur" fill="#58a6ff">▍</tspan></text>
</svg>